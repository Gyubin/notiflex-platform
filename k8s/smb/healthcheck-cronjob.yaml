apiVersion: batch/v1
kind: CronJob
metadata:
  name: notiflex-healthcheck
  namespace: notiflex
spec:
  # 5분마다. 프로브(5초)가 이미 Pod 단위 생사를 보고 있으므로, 이쪽은
  # Service·엔드포인트를 거친 경로가 실제로 응답하는지를 밖에서 확인하는 용도다.
  schedule: "*/5 * * * *"
  # 앞선 실행이 아직 안 끝났으면 이번 차례는 건너뛴다. 헬스체크가 밀려서
  # 여러 개가 동시에 도는 상황을 막는다.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # 5분 주기인데 그보다 늦게 시작할 거면 의미가 없으므로 그냥 놓친 것으로 처리한다.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # 실패하면 3번까지만 다시 시도하고 Job을 실패로 확정한다.
      backoffLimit: 3
      template:
        spec:
          # ch7.2에서 만든 ops-pool. 다른 매니페스트와 같은 GKE 자동 라벨을 쓴다.
          nodeSelector:
            cloud.google.com/gke-nodepool: ops-pool
          restartPolicy: OnFailure
          containers:
            - name: healthcheck
              # AGENTS 규칙 8에 따라 latest 대신 고정 태그를 쓴다.
              image: curlimages/curl:8.11.1
              command:
                - sh
                - -c
                # Service 포트가 8080이다. 포트를 빼면 80으로 붙으려다 항상 실패한다.
                - |
                  set -eu
                  URL="http://notiflex-api.notiflex.svc.cluster.local:8080/health"
                  BODY=$(mktemp)
                  CODE=$(curl -sS --max-time 10 -o "$BODY" -w '%{http_code}' "$URL")
                  if [ "$CODE" = "200" ]; then
                    echo "Health check passed (HTTP $CODE)"
                    echo "Response: $(cat "$BODY")"
                  else
                    echo "Health check failed (HTTP $CODE)" >&2
                    echo "Response: $(cat "$BODY")" >&2
                    exit 1
                  fi
              volumeMounts:
                # 루트 FS를 읽기 전용으로 두는 대신 mktemp 가 쓸 곳만 열어준다.
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
              # notiflex-api Rollout 과 같은 수준으로 맞춘다.
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
