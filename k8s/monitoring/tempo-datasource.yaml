apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: monitoring
  labels:
    # Loki 데이터소스와 같은 방식. Grafana 사이드카가 이 라벨을 보고 자동 등록한다.
    grafana_datasource: "1"
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        # 조회는 HTTP API(3200)로 한다. 4317은 앱이 트레이스를 보내는 수집 포트라 서로 다르다.
        url: http://tempo.monitoring.svc.cluster.local:3200
        # 기본 데이터소스는 Prometheus 하나뿐이어야 한다.
        # 여기서 true를 주면 Grafana가 "multiple datasources marked as default"로 기동 실패한다.
        isDefault: false
