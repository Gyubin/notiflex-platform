apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: notiflex-kafka
spec:
  # 학습 규모라 controller(메타데이터)와 broker(데이터) 역할을 한 Pod 에 겹쳐 둔다.
  # 운영에서는 controller 3대를 broker 와 분리하는 것이 기본이다.
  roles:
    - controller
    - broker
  replicas: 1
  storage:
    type: persistent-claim
    size: 5Gi
    # 클러스터를 지웠다 다시 만들 때 디스크가 남지 않도록 PVC 도 함께 정리한다.
    deleteClaim: true
    kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  template:
    pod:
      # Strimzi PodTemplate 에는 nodeSelector 필드가 없어 nodeAffinity 로 같은 결과를 만든다.
      # 라벨 키는 다른 매니페스트와 동일하게 GKE 가 자동으로 붙이는 노드풀 라벨을 쓴다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-nodepool
                    operator: In
                    values:
                      - worker-pool
