apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: notiflex-secrets
  namespace: enterprise
spec:
  # SecretProviderClass 는 네임스페이스 단위 리소스라 테넌트마다 따로 만들어야 한다.
  # 교재는 여기서 Valkey 비밀번호를 Secret 매니페스트에 직접 적지만,
  # 이 저장소는 ch6.2 에서 정한 대로 Secret Manager 를 그대로 마운트한다.
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/project-b3c5c78c-8a5c-4e47-9fe/secrets/valkey-password/versions/latest
        path: valkey-password
